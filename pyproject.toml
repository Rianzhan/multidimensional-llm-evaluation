[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multidimensional-llm-evaluation"
version = "1.0.0"
description = "Reproducible multi-model evaluation across knowledge, instruction following, robustness, stability, latency, and API reliability."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yan Zeng" }]
keywords = [
  "llm-evaluation",
  "model-evaluation",
  "mmlu-pro",
  "ifeval",
  "robustness",
  "ai-product",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "openai>=1.0,<3",
  "matplotlib>=3.8,<4",
  "datasets>=3,<5",
  "absl-py>=2,<3",
  "langdetect>=1.0.9,<2",
  "nltk>=3.9,<4",
  "immutabledict>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/Rianzhan/multidimensional-llm-evaluation"
Issues = "https://github.com/Rianzhan/multidimensional-llm-evaluation/issues"

[project.scripts]
llm-eval = "llm_eval.cli:main"
llm-eval-recover = "llm_eval.recovery_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
