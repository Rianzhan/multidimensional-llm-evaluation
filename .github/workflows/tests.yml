name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Download IFEval NLTK resources
        run: python -m nltk.downloader -d data/nltk_data punkt punkt_tab
      - name: Run tests
        env:
          GLM_API_KEY: test-only-glm-key
          KIMI_API_KEY: test-only-kimi-key
          DEEPSEEK_API_KEY: test-only-deepseek-key
        run: python -m pytest -q
      - name: Verify installed CLI outside the checkout
        env:
          GLM_API_KEY: test-only-glm-key
          KIMI_API_KEY: test-only-kimi-key
          DEEPSEEK_API_KEY: test-only-deepseek-key
          LLM_EVAL_PROJECT_ROOT: ${{ github.workspace }}
        run: python -c "import subprocess, tempfile; subprocess.check_call(['llm-eval', '--dry-run'], cwd=tempfile.mkdtemp())"
